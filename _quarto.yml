project:
  type: website
  output-dir: .
  render:
    - "*.qmd"
    - "labs/*.ipynb"
    - "lecture-demos/**/*.ipynb"
    - "!slides/"

website:
  title: "CS 203 · Software tools and techniques for AI"
  description: "Slides, labs, cheat sheets and short videos for CS 203 Software tools and techniques for AI at IIT Gandhinagar"
  navbar:
    title: "CS 203 · Software tools and techniques for AI"
    right:
      - text: Home
        href: index.qmd
      - text: Course website
        href: https://nipunbatra.github.io/stt-ai-26/
      - text: Instructor
        href: https://nipunbatra.github.io
  page-footer:
    left: "CS 203 Software tools and techniques for AI · IIT Gandhinagar · January 2026"
    right: "© 2026 [Nipun Batra](https://nipunbatra.github.io) · Source on [GitHub](https://github.com/nipunbatra/stt-ai-teaching) · Made with [Quarto](https://quarto.org)"

format:
  html:
    from: markdown-smart
    theme:
      light: [cosmo, nb-course.scss]
      dark: [darkly, nb-course.scss]
    toc: false
    smooth-scroll: false
    highlight-style: github
    code-copy: true
    link-external-newwindow: true
    anchor-sections: true
    fig-responsive: true
